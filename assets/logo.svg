<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 18 18">
  <style>
    .ink { fill: #1d1c19 }
    .faint { fill: #1d1c19; fill-opacity: 0.34 }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #ece8e0 }
      .faint { fill: #ece8e0; fill-opacity: 0.4 }
    }
  </style>
  <rect class="ink" x="0" y="0" width="8" height="8" rx="2" />
  <rect class="faint" x="10" y="0" width="8" height="8" rx="2" />
  <rect class="faint" x="0" y="10" width="8" height="8" rx="2" />
  <rect class="ink" x="10" y="10" width="8" height="8" rx="2" />
</svg>
